[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "openserp"
version = "0.2.5"
description = "Python SDK for the OpenSERP self-hosted server and OpenSERP Cloud."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "OpenSERP" }]
keywords = [
  "openserp",
  "serp",
  "serp-api",
  "search",
  "search-api",
  "google-search",
  "google-search-api",
  "google",
  "bing",
  "yandex",
  "baidu",
  "duckduckgo",
  "ecosia",
  "scraper",
  "scraping",
  "web-scraping",
  "serpapi",
  "serpapi-alternative",
  "seo",
  "rank-tracking",
  "rank-tracker",
  "keyword-research",
  "ai",
  "ai-grounding",
  "rag",
  "llm",
  "llm-tools",
  "agent",
  "agent-tools",
  "openai",
  "anthropic",
  "mcp",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Framework :: AsyncIO",
  "Framework :: Pydantic :: 2",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3"]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.5",
]

[project.urls]
Homepage = "https://openserp.org"
Documentation = "https://openserp.org/docs"
Repository = "https://github.com/openserpapi/sdk-python"
Issues = "https://github.com/openserpapi/sdk-python/issues"
Changelog = "https://github.com/openserpapi/sdk-python/releases"
"Chat (Telegram)" = "https://t.me/openserp_cloud"

[tool.hatch.build.targets.wheel]
packages = ["src/openserp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
